name: Build and deploy

on:
  schedule:
    - cron: '23 4 */2 * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build events.json
        run: node update-events.js
        env:
          GI_EVENT_USER_AGENT: gi-eventmap-prototype/0.1 (+https://github.com/${{ github.repository }})

      - name: Persist geocode cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .geocode-cache.json
          if git diff --cached --quiet; then
            echo "Geocode cache unchanged"
          else
            git commit -m "chore: update geocode cache [skip ci]"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html events.json site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
